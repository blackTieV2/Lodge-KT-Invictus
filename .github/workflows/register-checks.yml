name: Register checks
on:
  push:
    branches: [main, feature/member-status-frontend]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Core regression tests
        run: node --test tests/core.test.mjs
      - name: Build portable page without member data
        run: node scripts/build.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser workflow over localhost
        run: python tests/browser_smoke.py
      - name: Browser workflow as a local file
        env:
          INVICTUS_FILE: '1'
        run: python tests/browser_smoke.py
