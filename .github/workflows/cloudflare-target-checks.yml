name: Cloudflare-only target checks
on:
  pull_request:
  push:
    branches: [main, feature/cloudflare-only-backups]
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/cloudflare-target.test.mjs
      - run: node --check scripts/deploy-online.mjs
