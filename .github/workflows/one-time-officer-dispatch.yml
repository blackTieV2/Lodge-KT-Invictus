# One-time recovery of the owner's failed deployment. Never merged into main.
# No Cloudflare secret access and no branch code checkout. Only dispatch the
# existing main-only, production-environment workflow at the reviewed main head.
name: One-time officer deployment dispatch
on:
  push:
    branches: [ops/officer-deploy-20261012]
    paths: [.github/workflows/one-time-officer-dispatch.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'blackTieV2/Lodge-KT-Invictus' && github.ref == 'refs/heads/ops/officer-deploy-20261012' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check reviewed main and dispatch its existing production workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          repo='blackTieV2/Lodge-KT-Invictus'
          expected='6d9c2c94b3b87c16f500f1986c0a7697be6bed9e'
          actual=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          if [ "$actual" != "$expected" ]; then
            echo 'Main changed after review. No deployment was requested.'
            exit 1
          fi
          gh workflow run deploy-online.yml --repo "$repo" --ref main
          echo 'Requested canonical main deployment; completion must be verified separately.'
