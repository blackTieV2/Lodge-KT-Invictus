name: Publish tested home-lab image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - homelab/**
      - server/**
      - migrations/**
      - web/**
      - app/core.js
      - app/styles.css
      - scripts/build-online.mjs
      - tests/homelab.test.mjs
      - tests/container-smoke.mjs
      - .github/workflows/publish-homelab.yml
permissions:
  contents: read
concurrency:
  group: invictus-homelab-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Regression tests
        run: node --test tests/core.test.mjs tests/online.test.mjs tests/deploy-policy.test.mjs tests/homelab.test.mjs
      - name: Build and test the exact container before publishing
        run: |
          docker build --pull --label org.opencontainers.image.source=https://github.com/blackTieV2/Lodge-KT-Invictus --label org.opencontainers.image.revision="$GITHUB_SHA" -t invictus-homelab:test .
          node tests/container-smoke.mjs
      - name: Push code-only image; no deployment or personal data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image="ghcr.io/blacktiev2/lodge-kt-invictus:sha-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag invictus-homelab:test "$image"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          printf 'Tested home-lab image: `%s`\n\nThis publishes an image only. Home-lab deployment and live sign-in are not yet verified.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry login from runner
        if: always()
        run: docker logout ghcr.io || true
