name: Read-only Invictus Access policy shape
on:
  push:
    branches: [fix/access-policy-shape]
    paths:
      - scripts/inspect-access-policy-shape.mjs
      - .github/workflows/access-policy-shape-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'blackTieV2/Lodge-KT-Invictus' && github.ref == 'refs/heads/fix/access-policy-shape'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read only field names and types from the exact Invictus policy
        run: node scripts/inspect-access-policy-shape.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OFFICER_ROLES: ${{ secrets.OFFICER_ROLES }}
