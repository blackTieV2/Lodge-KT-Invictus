name: Deploy online register
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: invictus-online-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/online.test.mjs tests/deploy-policy.test.mjs
      - run: node scripts/build-online.mjs
      - name: Protected Cloudflare deployment
        run: node scripts/deploy-online.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OFFICER_ROLES: ${{ secrets.OFFICER_ROLES }}
          GITHUB_TOKEN: ${{ github.token }}
